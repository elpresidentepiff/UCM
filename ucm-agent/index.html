<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>UCM Agent</title>
<style>
:root{--green:#1f5b42;--deep:#102d23;--lime:#8bbd45;--ink:#111;--muted:#5f6a63;--line:#dce5df;--bg:#f5f7f5}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
.hero{background:linear-gradient(112deg,var(--deep),var(--green) 72%,#37724f);color:#fff}
.hero-inner{width:min(900px,100%);margin:auto;min-height:142px;padding:24px 20px;display:flex;align-items:center;gap:28px}
.ucm{font-size:78px;line-height:.88;font-weight:1000;letter-spacing:-.075em}.hero-copy{border-left:4px solid var(--lime);padding:7px 0 7px 22px}
.hero-copy strong{display:block;font-size:16px;line-height:1.25;letter-spacing:.055em}.hero-copy span{display:block;margin-top:8px;font-size:12px;font-weight:900;letter-spacing:.16em;color:#dcedd6}
.wrap{width:min(900px,100%);margin:auto;padding:18px 12px 48px}
.search,.empty{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 30px rgba(16,45,35,.08)}
.search{padding:18px;border-left:6px solid var(--lime);margin-bottom:14px}
.label{font-size:12px;font-weight:950;letter-spacing:.08em;text-transform:uppercase;color:#111;margin-bottom:8px}
.row{display:flex;gap:9px}.row input{height:58px;flex:1;min-width:0;border:2px solid #b9c7bd;border-radius:14px;padding:0 15px;font-size:20px;font-weight:900;color:#111;outline:none;background:#fff}
.row input:focus{border-color:var(--green);box-shadow:0 0 0 4px rgba(31,91,66,.1)}
button{font:inherit}.find{min-width:108px;border:0;border-radius:14px;background:var(--green);color:#fff;font-weight:950;font-size:16px;cursor:pointer}
.hint{margin:9px 1px 0;font-size:13px;font-weight:650;color:var(--muted)}
.empty{text-align:center;padding:46px 20px;color:var(--muted);font-size:15px;line-height:1.5}.empty b{display:block;font-size:22px;color:#111;margin-bottom:6px}
.error{color:#9f2f21;margin-top:10px;font-weight:800}
@media(max-width:620px){.hero-inner{min-height:118px;padding:18px 14px;gap:14px;align-items:flex-end}.ucm{font-size:58px}.hero-copy{border-left-width:2px;padding-left:12px}.hero-copy strong{font-size:10px}.hero-copy span{font-size:9px;margin-top:5px}.wrap{padding:10px 7px 30px}.search{padding:15px 13px}.find{min-width:86px}}
</style>
</head>
<body>
<header class="hero"><div class="hero-inner"><div class="ucm">UCM</div><div class="hero-copy"><strong>UNIVERSAL CLEANING &amp; MAINTENANCE SERVICES</strong><span>DEFECT OPERATIONS</span></div></div></header>
<main class="wrap">
<section class="search">
  <div class="label">Defect</div>
  <div class="row"><input id="q" inputmode="numeric" autocomplete="off" placeholder="Enter defect number"/><button class="find" id="find">Find</button></div>
  <div class="hint">Enter <b>481921</b> to view the job.</div>
  <div class="error" id="error" hidden>Defect not found. Please check the number.</div>
</section>
<section class="empty"><b>One number. Current job information.</b>Enter the defect number to open the job record.</section>
</main>
<script>
const q=document.getElementById('q'),err=document.getElementById('error');
function go(){const v=q.value.trim().replace(/^DEF[-\s]*/i,'');if(v==='481921'){location.href='defect.html?defect='+encodeURIComponent(v)}else{err.hidden=false}}
document.getElementById('find').onclick=go;q.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
</script>
</body></html>
